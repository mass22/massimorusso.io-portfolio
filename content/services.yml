description: Développeur Vue.js senior depuis 2011, j'interviens en construction, en architecture et en décision technique, selon les besoins de l'équipe et du projet.
faq:
  title: Questions fréquentes
  description: Réponses aux questions les plus courantes concernant mon accompagnement et mon expertise.
  categories:
    - title: Missions & Collaboration
      questions:
        - label: Intervenez-vous comme développeur ou comme architecte ?
          content: |
            Les deux. Mon approche est "hands-on" : je bâtis vos applications Vue.js/Nuxt tout en apportant la vision architecturale nécessaire aux décisions structurantes. Je ne me contente pas de conseiller, j'implémente les solutions pour garantir leur viabilité.
        - label: Travaillez-vous uniquement sur Vue.js et Nuxt ?
          content: |
            C'est mon cœur d'expertise, là où ma valeur ajoutée est immédiate. Cependant, l'IA et mes 14 ans d'expérience ont supprimé la barrière de la syntaxe : je suis capable d'intervenir et d'être productif rapidement sur des stacks **React** ou **Angular** si le projet le demande.
        - label: Quel est votre mode de collaboration et localisation ?
          content: |
            Je suis basé dans le Grand Montréal (Rive-Nord). Je travaille principalement à distance pour maximiser la concentration, mais je me déplace pour les jalons critiques, les sessions d'architecture ou pour m'imprégner de la culture de votre équipe. Le rythme s'adapte à votre contexte (mandat continu ou mission ciblée).
    - title: IA & Modernisation
      questions:
        - label: Proposez-vous d'intégrer l'IA dans nos produits ?
          content: |
            Oui, mais avec une approche pragmatique. Je n'intègre pas l'IA pour suivre une mode, mais pour résoudre des problèmes réels (automatisation de workflows, recherche intelligente, etc.). Mon rôle est de vous aider à décider où l'IA apporte une valeur mesurable sans fragiliser votre architecture.
        - label: Accompagnez-vous des équipes sur du code Legacy ?
          content: |
            C'est une grande partie de mes interventions. J'aide les équipes à stabiliser leurs applications existantes (souvent en Vue 2 / Nuxt 2) et à tracer une route de migration sécurisée vers des technologies modernes, tout en continuant de livrer de nouvelles fonctionnalités.
        - label: Comment l'IA change-t-elle votre manière de travailler ?
          content: |
            Elle me permet d'être un "multiplicateur". J'utilise l'IA pour accélérer l'implémentation et explorer des options techniques, ce qui me libère du temps pour me concentrer sur ce qui compte vraiment : la logique d'affaires, la sécurité et la robustesse de votre plateforme.
