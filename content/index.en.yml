companies:
  title: Contexts I work in
  description: |
    Frontend Architect & Advisor on the Vue.js and Nuxt ecosystem—for organizations that must modernize without breaking production, scale their foundations, and make high-impact technical calls with confidence.
  patterns:
    - title: Legacy system audit & modernization
      description: |
        Diagnose the current state, prioritize risks, and define a realistic path to move complex stacks (Vue 2, Nuxt 2) toward TypeScript, Vue 3, and Nuxt 3—without service disruption or an unrealistic big bang.
    - title: Platform architecture & shared services
      description: |
        Design robust technical foundations, component libraries, and a Storybook setup that holds up in production: standardize development, cut duplication, and speed up product teams at scale.
    - title: Performance & operational resilience
      description: |
        Stabilize delivery by removing bottlenecks (perceived speed, bundle size, rendering) and adding durable safeguards—automated tests (Vitest, Playwright) and reliable CI/CD pipelines.
    - title: Technical leadership & decision support
      description: |
        Support executives and leads (CTO, engineering leads) to decide quickly and document clearly; mentor teams to grow autonomy, deep review habits, and documentation that teams actually use.
  companies:
