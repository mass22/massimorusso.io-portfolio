faq:
  title: Frequently asked questions
  description: Answers to common questions about my role, how I work, and how I engage with teams.
  categories:
    - title: Architecture & technical decisions
      questions:
        - label: What's the difference between a senior developer and someone who focuses on architecture?
          content: |
            A senior developer executes and ships. Someone with an architectural mindset builds while thinking about what it costs to maintain in two years.

            I do both—that's what sets me apart.
        - label: Do you only work on Vue.js and Nuxt projects?
          content: |
            Yes. Vue.js and Nuxt have been my focus since 2011.

            I'd rather be excellent in one ecosystem than average across several.
        - label: What kind of engagements do you take on?
          content: |
            Building features, structuring architecture, technical reviews, or decision support.

            I don't do bugfix-only work or migrations without a construction angle.
    - title: Collaboration & format
      questions:
        - label: What does an engagement look like in practice?
          content: |
            I join the existing team, understand context and constraints, then build and structure in parallel.

            Pace and format (ongoing support, a focused engagement, workshops) adapt to your organization—we align on this from the first conversation.
        - label: Remote or on-site?
          content: |
            Mostly remote from Belgium.

            Occasional on-site visits are possible depending on context.
    - title: AI & modernization
      questions:
        - label: How do you use AI in your work?
          content: |
            As a tool, not an oracle. I use AI to explore options, speed up some tasks, and challenge my decisions.

            Not to replace technical judgment.
        - label: Can you help integrate AI into an existing product?
          content: |
            Yes, when it makes sense. My approach: identify real problems first, assess whether AI delivers measurable value, then integrate progressively without weakening the existing architecture.
