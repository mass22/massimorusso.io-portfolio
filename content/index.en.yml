about:
  title: About
  description: |
    I've been a frontend developer since 2011, working exclusively with Vue.js and Nuxt since their early days.

    Over time, I've learned that projects that fail rarely lack good developers.

    They lack clear decisions, owned and understood by the whole team.

    I build and I structure: both at once.
