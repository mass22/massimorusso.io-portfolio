    - title: Frontend architecture
      slug: frontend-architecture
      icon: i-ph-lightbulb
      description: |
        I help teams structure and evolve their frontend in complex contexts.

        Stack analysis, target architecture, progressive modernization strategies, and trade-offs that last.
