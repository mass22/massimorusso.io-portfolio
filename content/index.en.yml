about:
  title: About
  description: |
    I've been a frontend developer since 2011, working exclusively with Vue.js and Nuxt since their early days.

    Over time, I've learned that projects that fail rarely lack good developers.

    They lack clear decisions, owned and understood by the whole team.

    I build and I structure: both at once.
services:
  title: Services
  description: "Senior Vue.js developer since 2011, I focus on building, architecture, and technical decisions—depending on what the team and project need."
  items:
    - title: Vue.js / Nuxt development
      slug: vuejs-development
      icon: i-ph-code
      description: |
        I join teams to build robust, performant, and maintainable Vue.js and Nuxt applications.

        I work on building—not bugfix-only or migration-only work.
      bullets:
